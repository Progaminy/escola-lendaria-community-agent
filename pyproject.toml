[project]
name = "escola-lendaria-community-agent"
version = "0.3.0"
description = "A Strands-powered Good Neighbor agent for school communities."
requires-python = ">=3.10"
dependencies = [
  "strands-agents>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "boto3>=1.35.0",
  "bedrock-agentcore>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
