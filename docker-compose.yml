services:
  agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: ${AWS_REGION:-us-west-2}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
      COMMUNITY_AGENT_DB: /app/data/community_agent.db
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-900}
      COMMUNITY_AGENT_MODE: ${COMMUNITY_AGENT_MODE:-policy}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - community-agent-data:/app/data

volumes:
  community-agent-data:
